name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Deploy only when the CI run for this commit succeeded (or on manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default-branch tip by default —
          # pin to the exact SHA that passed CI. Empty on workflow_dispatch → falls back.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build extension host
        run: node esbuild.mjs
        working-directory: vscode-extension

      - name: Install webview dependencies
        run: npm ci
        working-directory: vscode-extension/webview

      - name: Build webview
        run: npx vite build
        working-directory: vscode-extension/webview

      - name: Package VS Code extension
        run: npx @vscode/vsce@3.9.2 package
        working-directory: vscode-extension

      - name: Copy .vsix to dist with stable name
        run: cp vscode-extension/*.vsix dist/md-reader-latest.vsix

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
