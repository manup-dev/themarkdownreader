name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Type check shared + claude-code-plugin
        run: |
          npx tsc -p shared/tsconfig.json --noEmit
          npx tsc -p claude-code-plugin/tsconfig.json --noEmit

      - name: Verify plugin hook bundle is up to date
        run: |
          # Use the plugin's own pinned build script as the single source of
          # truth (it pins esbuild@0.21.5). Generating it any other way — a
          # different CWD or an unpinned `npx esbuild` that floats to the
          # latest release — changes path comments / helper boilerplate and
          # breaks this byte-for-byte diff.
          npm run build --prefix claude-code-plugin
          git diff --exit-code claude-code-plugin/hook.mjs \
            || (echo "::error::claude-code-plugin/hook.mjs is stale — run 'npm run build' in claude-code-plugin/ and commit." && exit 1)

      - name: Install mcp-server dependencies
        working-directory: mcp-server
        run: npm ci

      - name: MCP + plugin pipeline e2e
        run: |
          (cd mcp-server && npm run build)
          node scripts/test-mcp-stdio.mjs
          node scripts/test-plugin-hook-e2e.mjs

      - name: MCP server unit tests
        run: npm run test:mcp

      - name: Plugin hook fresh-install smoke (no node_modules)
        run: bash scripts/test-plugin-hook-fresh-install.sh

      - name: Lint
        run: npm run lint

      - name: Validate extension manifest
        run: npm run test:extension

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  build-vscode-extension:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web app dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Build extension host
        working-directory: vscode-extension
        run: node esbuild.mjs

      - name: Install webview dependencies
        working-directory: vscode-extension/webview
        run: npm ci

      - name: Build webview
        working-directory: vscode-extension/webview
        run: npx vite build

      - name: Package extension
        working-directory: vscode-extension
        run: npx @vscode/vsce@3.9.2 package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          retention-days: 7
