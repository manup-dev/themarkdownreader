name: Hosted smoke tests

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      hosted_url:
        description: 'Override HOSTED_URL (leave blank for default)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'e2e-hosted/**'
      - 'playwright.hosted.config.ts'
      - '.github/workflows/smoke.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: hosted-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run hosted smoke tests
        env:
          HOSTED_URL: ${{ inputs.hosted_url || 'https://manup-dev.github.io/themarkdownreader/?demo=true' }}
        run: npm run e2e:hosted

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Open or update tracking issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = '[smoke] Hosted demo failing'
            const body = [
              `Scheduled hosted smoke tests failed at ${new Date().toISOString()}.`,
              '',
              `**Run:** ${runUrl}`,
              `**Hosted URL:** \`${process.env.HOSTED_URL}\``,
              '',
              'Download the Playwright report artifact from the run for screenshots/videos/traces.',
              '',
              'This issue will be auto-updated on subsequent failures. Close it manually once the site is healthy again.',
            ].join('\n')

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            })

            if (existing.data.total_count === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['smoke-failure', 'production'],
              })
            } else {
              const issueNumber = existing.data.items[0].number
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `Failed again at ${new Date().toISOString()} — ${runUrl}`,
              })
            }
        env:
          HOSTED_URL: ${{ inputs.hosted_url || 'https://manup-dev.github.io/themarkdownreader/?demo=true' }}
