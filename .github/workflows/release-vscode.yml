name: Release VS Code Extension

on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Verify tag matches vscode-extension version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#vscode-v}"
          PKG_VERSION=$(node -p "require('./vscode-extension/package.json').version")
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "Tag $TAG_VERSION != package $PKG_VERSION"; exit 1; }
      - name: Install extension deps
        run: npm ci
        working-directory: vscode-extension
      - name: Build extension host
        run: node esbuild.mjs
        working-directory: vscode-extension
      - name: Install webview deps
        run: npm ci
        working-directory: vscode-extension/webview
      - name: Build webview
        run: npx vite build
        working-directory: vscode-extension/webview
      - name: WDIO e2e gate (must pass before publish)
        run: xvfb-run -a npm run test:e2e
        working-directory: vscode-extension
      - name: Publish to Marketplace
        run: npx @vscode/vsce@3.9.2 publish -p ${{ secrets.VSCE_PAT }}
        working-directory: vscode-extension
